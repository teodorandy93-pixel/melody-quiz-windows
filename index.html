<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08070D">
<title>MELODY QUIZ — MTV EDITION</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <section id="screen-home" class="screen active">
    <div class="home-bg"></div>
    <div class="home-content">
      <div class="badge">MTV EDITION</div>
      <h1 class="title">MELODY<br>QUIZ</h1>
      <p class="slogan">GUESS THE SONG</p>
      <p class="sub">10 ICONIC TRACKS. ONE MUSIC CHALLENGE.</p>
      <div class="rounds-indicator" id="rounds-indicator"></div>
      <button id="btn-start" class="btn btn-primary">START GAME</button>
      <div class="meta-row">
        <span>10 ROUNDS</span><span>1000 POINTS</span><span>HEADPHONES RECOMMENDED</span>
      </div>
      <div class="eq" id="eq"></div>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <header class="game-header">
      <button id="btn-home" class="btn-icon" aria-label="Home">HOME</button>
      <div class="game-title">MELODY QUIZ</div>
      <div class="score-box">SCORE <span id="score">0</span></div>
    </header>
    <div class="round-line">ROUND <span id="round-num">01</span> / 10</div>
    <div class="progress" id="progress"></div>

    <div class="card-wrap">
      <div class="mystery-card" id="mystery-card">
        <div class="card-graphic" id="card-graphic">
          <div class="qmark">?</div>
          <div class="card-label">GUESS THE SONG</div>
        </div>
        <div class="reveal" id="reveal">
          <img id="cover-img" alt="Album cover" />
          <div class="cover-fallback" id="cover-fallback"></div>
          <div class="reveal-info">
            <div class="reveal-status" id="reveal-status"></div>
            <div class="reveal-title" id="reveal-title"></div>
            <div class="reveal-artist" id="reveal-artist"></div>
            <div class="reveal-points" id="reveal-points"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="player">
      <div class="player-status" id="player-status">READY</div>
      <div class="player-buttons">
        <button id="btn-play" class="btn btn-small">PLAY</button>
        <button id="btn-pause" class="btn btn-small">PAUSE</button>
        <button id="btn-replay" class="btn btn-small">REPLAY</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="audio-progress"></div></div>
      <div class="err-msg" id="err-msg"></div>
    </div>

    <div class="question">WHICH SONG IS THIS?</div>
    <div class="answers" id="answers"></div>

    <div class="timer-wrap">
      <div class="timer-label">TIME</div>
      <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="timer-num" id="timer-num">20</div>
    </div>

    <div class="next-wrap" id="next-wrap">
      <button id="btn-next" class="btn btn-primary">NEXT ROUND</button>
    </div>
  </section>

  <section id="screen-result" class="screen">
    <div class="result-content">
      <h2>GAME COMPLETE</h2>
      <div class="result-score" id="result-score">0 / 1000</div>
      <div class="result-stats">
        <div>Correct: <span id="result-correct">0</span></div>
        <div>Percentage: <span id="result-pct">0%</span></div>
      </div>
      <div class="result-title" id="result-title"></div>
      <ul class="result-list" id="result-list"></ul>
      <div class="result-buttons">
        <button id="btn-replay-game" class="btn btn-primary">PLAY AGAIN</button>
        <button id="btn-home2" class="btn btn-secondary">BACK TO HOME</button>
      </div>
    </div>
  </section>
</div>

<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
